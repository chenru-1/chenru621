<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS对象</title>
    <!--类 实例就是对象，两个要素 属性和方法
    学生的属性：姓名，学号，性别，年龄，班级，学号，
    方法：学习，作业，考试，-->>
</head>
<body>
    <script>
        var student = {
            name: '张三',
            age: 18,
            sex: '男',
            class: '1-1',
            number: '2019001',
            happy:['吃','喝','玩'],
            study: function () {
                console.log('学习')
            },
            homework: function () {
                console.log('作业')
            },
            exam: function () {
                console.log('考试')
            },
            watchmovie: function () {
                console.log('看电视')
            }
        }
        console.log(student.name)
        console.log(student.study());
        //v删除对象方法
        delete student.watchmovie;
        //判断对象中是否有某个属性
        console.log('watchmovie'in student);
        //对象属性遍历
        for (var key in student) {
            console.log(key, student[key])
        }
        //对象赋值实质上是引用类型，相当于起别名，多个变量引用同一个对象
        var o=student;
        console.log(o.name);
        o.name='王五';
        //对象引用类型（引用的是地址）
        console.log('o的名字'+o.name);
        console.log('student的名字'+student.name);
        </script>
</body>
</html>
